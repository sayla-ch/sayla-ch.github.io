<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayla OFFICIAL SITE</title>
    <!-- アイコン: FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        /* カラー・変数設定 */
        :root {
            --bg-color: #FFFFFF;        /* 背景：白 */
            --sub-color: #40A2C7;       /* サブ：水色 */
            --accent-color: #CD498F;    /* アクセント：ピンク */
            --main-text: #333333;       /* メイン文字色：濃いグレー */
            --sub-text: #666666;        /* サブ文字色 */
            --border-color: #EEEEEE;    /* 境界線 */
        }

        body {
            background-color: var(--bg-color);
            color: var(--main-text);
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.8;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            transition: 0.3s;
        }

        /* ヘッダー */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 2px solid var(--sub-color);
        }

        header h1 {
            font-size: 1.6rem;
            letter-spacing: 0.4em;
            font-weight: bold;
            color: var(--sub-color);
            margin: 0;
        }

        /* メインビジュアル */
        .keyvisual {
            position: relative;
            width: 100%;
            height: 70vh;
            background-color: #f9f9f9;
            background-image: url("image/20251210_215907.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* セクション共通 */
        section {
            max-width: 1000px;
            margin: 0 auto;
            padding: 80px 20px;
        }

        h2.section-title {
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 50px;
            letter-spacing: 0.2em;
            color: var(--main-text);
            position: relative;
        }

        h2.section-title::after {
            content: "";
            display: block;
            width: 50px;
            height: 3px;
            background: var(--sub-color);
            margin: 10px auto 0;
        }

        /* ABOUT */
        .about-content {
            text-align: center;
            margin-bottom: 40px;
        }

        .sayla-name {
            font-size: 2.4rem;
            font-weight: bold;
            color: var(--main-text);
            margin-bottom: 5px;
        }

        .sayla-id {
            color: var(--sub-color);
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* SNSリンク（ボタン） */
        .sns-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .sns-link {
            background: #fff;
            border: 2px solid var(--sub-color);
            color: var(--sub-color);
            width: 220px;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            border-radius: 30px;
        }

        .sns-link:hover {
            background: var(--sub-color);
            color: #fff;
        }

        /* WORKS (YouTube) */
        .works-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
        }

        .work-item {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
        }

        /* YouTubeを16:9の横長に固定する設定 */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .work-info {
            padding: 20px;
        }

        .work-info h3 {
            font-size: 1rem;
            margin-bottom: 12px;
            color: var(--main-text);
            height: 2.8em;
            display: flex;
            align-items: center;
        }

        /* タグ */
        .tags {
            display: flex;
            gap: 8px;
        }

        .tag {
            font-size: 0.75rem;
            background-color: var(--accent-color);
            color: #fff;
            padding: 2px 12px;
            border-radius: 15px;
            font-weight: bold;
            letter-spacing: 0.05em;
        }

        /* フッター */
        footer {
            padding: 60px 0;
            text-align: center;
            background-color: #f9f9f9;
            color: var(--sub-text);
            font-size: 0.8rem;
        }

        /* スマホ対応 */
        @media (max-width: 600px) {
            .keyvisual {
                background-attachment: scroll;
                height: 50vh;
            }
            .works-grid {
                grid-template-columns: 1fr;
            }
            .sns-link {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Sayla</h1>
    </header>

    <!-- メイン画像表示エリア -->
    <div class="keyvisual"></div>

    <section id="about">
        <h2 class="section-title">ABOUT</h2>
        <div class="about-content">
            <div class="sayla-name">Sayla</div>
            <p class="sayla-id">@sayla_ch</p>
            <p>ツイキャス・nanaを中心に活動中。<br>歌唱のほか、MIX制作・動画制作などのクリエイティブも行っています。</p>
        </div>

        <div class="sns-container">
            <a href="https://x.com/sayla_ch" target="_blank" class="sns-link">
                <i class="fa-brands fa-x-twitter"></i> X (Twitter)
            </a>
            <a href="https://twitcasting.tv/_say_la" target="_blank" class="sns-link">
                <i class="fa-solid fa-tower-broadcast"></i> TwitCasting
            </a>
            <a href="http://www.youtube.com/@sayla_ch" target="_blank" class="sns-link">
                <i class="fa-brands fa-youtube"></i> YouTube
            </a>
        </div>
    </section>

    <section id="works">
        <h2 class="section-title">WORKS</h2>
        <div class="works-grid">
            
            <!-- 実績1：アイデンティティ -->
            <div class="work-item">
                <div class="video-wrapper">
                    <!-- YouTubeの埋め込みURL -->
                    <iframe src="https://www.youtube.com/embed/xlNm8FPTJRo" title="YouTube video player" allowfullscreen></iframe>
                </div>
                <div class="work-info">
                    <h3>アイデンティティ / 恋町レノ × Sayla</h3>
                    <div class="tags">
                        <span class="tag">Vocal</span>
                        <span class="tag">MIX</span>
                        <span class="tag">Movie</span>
                    </div>
                </div>
            </div>

            <!-- 実績2：プロポーズ (Shortsも横長枠で表示) -->
            <div class="work-item">
                <div class="video-wrapper">
                    <!-- Shortsもembed形式にすれば横長プレイヤーの中で再生されます -->
                    <iframe src="https://www.youtube.com/embed/CeFgU-8giUU" title="YouTube video player" allowfullscreen></iframe>
                </div>
                <div class="work-info">
                    <h3>プロポーズ💍歌ってみた【恋町レノ】</h3>
                    <div class="tags">
                        <span class="tag">MIX</span>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <footer>
        &copy; Sayla. All Rights Reserved.
    </footer>

</body>
</html>
