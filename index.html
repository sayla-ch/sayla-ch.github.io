<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayla OFFICIAL SITE</title>
    
    <!-- ファビコン設定 -->
    <link rel="icon" href="image/20251229_215250.jpg">
    <link rel="apple-touch-icon" href="image/20251229_215250.jpg">

    <!-- アイコン: FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        /* カラー・変数設定 */
        :root {
            --bg-color: #FFFFFF;        /* 背景：白 */
            --sub-color: #40A2C7;       /* サブ：水色 */
            --accent-color: #CD498F;    /* アクセント：ピンク */
            --main-text: #333333;       /* メイン文字色 */
            --sub-text: #666666;        /* サブ文字色 */
            --border-color: #EEEEEE;    /* 境界線 */
        }

        body {
            background-color: var(--bg-color);
            color: var(--main-text);
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.8;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            transition: 0.3s;
        }

        /* ヘッダー */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 2px solid var(--sub-color);
        }

        header h1 {
            font-size: 1.6rem;
            letter-spacing: 0.4em;
            font-weight: bold;
            color: var(--sub-color);
            margin: 0;
        }

        /* メインビジュアル */
        .keyvisual {
            position: relative;
            width: 100%;
            height: 70vh;
            background-color: #f9f9f9;
            background-image: url("image/20251210_215907.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* セクション共通 */
        section {
            max-width: 1000px;
            margin: 0 auto;
            padding: 80px 20px;
        }

        h2.section-title {
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: 0.2em;
            color: var(--main-text);
            position: relative;
        }

        h2.section-title::after {
            content: "";
            display: block;
            width: 40px;
            height: 3px;
            background: var(--sub-color);
            margin: 10px auto 0;
        }

        /* ABOUT & PROFILE ICON */
        .about-content {
            text-align: center;
            margin-bottom: 40px;
        }

        .profile-icon {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--sub-color);
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .sayla-name {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--main-text);
            margin-bottom: 5px;
        }

        .sayla-id {
            color: var(--sub-color);
            font-weight: bold;
            margin-bottom: 25px;
            display: block;
        }

        .profile-text {
            max-width: 600px;
            margin: 0 auto;
            color: var(--main-text);
            font-size: 0.95rem;
            text-align: center;
        }

        /* SNSリンク（アイコンのみスタイル） */
        .sns-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 35px;
        }

        .sns-link {
            width: 55px;
            height: 55px;
            background: #fff;
            border: 2px solid var(--sub-color);
            color: var(--sub-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            border-radius: 50%;
            transition: 0.3s;
        }

        .sns-link:hover {
            background: var(--sub-color);
            color: #fff;
            transform: translateY(-5px);
        }

        /* WORKS (YouTube) */
        .works-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
        }

        .work-item {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .work-info {
            padding: 20px;
        }

        .work-info h3 {
            font-size: 1rem;
            margin-bottom: 12px;
            color: var(--main-text);
        }

        /* タグ */
        .tags {
            display: flex;
            gap: 8px;
        }

        .tag {
            font-size: 0.75rem;
            background-color: var(--accent-color);
            color: #fff;
            padding: 2px 12px;
            border-radius: 15px;
            font-weight: bold;
            letter-spacing: 0.05em;
        }

        /* フッター */
        footer {
            padding: 60px 0;
            text-align: center;
            background-color: #f9f9f9;
            color: var(--sub-text);
            font-size: 0.8rem;
        }

        /* スマホ対応 */
        @media (max-width: 600px) {
            .keyvisual {
                background-attachment: scroll;
                height: 50vh;
            }
            .works-grid {
                grid-template-columns: 1fr;
            }
            .sns-link {
                width: 50px;
                height: 50px;
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Sayla</h1>
    </header>

    <div class="keyvisual"></div>

    <section id="about">
        <h2 class="section-title">ABOUT</h2>
        <div class="about-content">
            <!-- 指定されたアイコン画像 -->
            <img src="image/20251025_185455.jpg" alt="Sayla Icon" class="profile-icon">
            
            <div class="sayla-name">Sayla</div>
            <span class="sayla-id">@sayla_ch</span>
            
            <div class="profile-text">
                <p>INFP-T ／ 成人済 ／ 低音女子・両声類かも？</p>
                <p>一人称迷子で言動荒めな奴と覚えてください</p>
                <p>歌とゲームが好き</p>
                <p>夢はでっかく配信者屋さんになること</p>
                <p style="margin-top: 1em; font-weight: bold; color: var(--accent-color);">推しは推せる時に推そうな？</p>
            </div>
        </div>

        <div class="sns-container">
            <!-- X -->
            <a href="https://x.com/sayla_ch" target="_blank" class="sns-link" title="X (Twitter)">
                <i class="fa-brands fa-x-twitter"></i>
            </a>
            <!-- TwitCasting -->
            <a href="https://twitcasting.tv/_say_la" target="_blank" class="sns-link" title="TwitCasting">
                <i class="fa-solid fa-tower-broadcast"></i>
            </a>
            <!-- YouTube -->
            <a href="http://www.youtube.com/@sayla_ch" target="_blank" class="sns-link" title="YouTube">
                <i class="fa-brands fa-youtube"></i>
            </a>
            <!-- nana -->
            <a href="https://nana-music.com/users/10371954" target="_blank" class="sns-link" title="nana">
                <i class="fa-solid fa-microphone-lines"></i>
            </a>
            <!-- Marshmallow -->
            <a href="https://marshmallow-qa.com/_say_la" target="_blank" class="sns-link" title="Marshmallow">
                <i class="fa-solid fa-envelope-open-text"></i>
            </a>
        </div>
    </section>

    <section id="works">
        <h2 class="section-title">WORKS</h2>
        <div class="works-grid">
            
            <div class="work-item">
                <div class="video-wrapper">
                    <iframe src="https://www.youtube.com/embed/xlNm8FPTJRo" title="YouTube video player" allowfullscreen></iframe>
                </div>
                <div class="work-info">
                    <h3>アイデンティティ / 恋町レノ × Sayla</h3>
                    <div class="tags">
                        <span class="tag">Vocal</span>
                        <span class="tag">MIX</span>
                        <span class="tag">Movie</span>
                    </div>
                </div>
            </div>

            <div class="work-item">
                <div class="video-wrapper">
                    <iframe src="https://www.youtube.com/embed/CeFgU-8giUU" title="YouTube video player" allowfullscreen></iframe>
                </div>
                <div class="work-info">
                    <h3>プロポーズ💍歌ってみた【恋町レノ】</h3>
                    <div class="tags">
                        <span class="tag">MIX</span>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <footer>
        &copy; Sayla. All Rights Reserved.
    </footer>

</body>
</html>
