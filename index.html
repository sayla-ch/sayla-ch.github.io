<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayla OFFICIAL SITE</title>
    
    <!-- ファビコン設定 -->
    <link rel="icon" href="image/20251229_215250.jpg">
    <link rel="apple-touch-icon" href="image/20251229_215250.jpg">

    <!-- アイコン: FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        /* フォント設定: 黒薔薇シンデレラ */
        @font-face {
            font-family: 'Kurobara';
            src: url('font/MODI_kurobara-cinderella_2018_0805/kurobara-cinderella.ttf') format('truetype');
        }

        :root {
            --bg-color: #FFFFFF;
            --sub-color: #40A2C7;
            --accent-color: #CD498F;
            --main-text: #333333;
            --border-color: #EEEEEE;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--main-text);
            font-family: 'Kurobara', "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            text-align: center;
        }

        a {
            text-decoration: none !important;
            color: inherit;
            transition: 0.3s;
        }

        /* --- レイアウト全体設定 (PC) --- */
        .container {
            display: flex;
            width: 100%;
        }

        /* 左半分：メイン画像固定エリア (アイコン画像を大きく使用) */
        .left-side {
            width: 50%;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            background-image: url("image/20251025_185455.jpg");
            background-size: cover;
            background-position: center;
            border-right: 1px solid var(--border-color);
        }

        /* 右半分：スクロールコンテンツエリア */
        .right-side {
            width: 50%;
            margin-left: 50%;
            padding-top: 40px;
        }

        /* セクション共通 */
        section {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h2.section-title {
            font-size: 1.4rem;
            margin-bottom: 25px;
            letter-spacing: 0.2em;
            display: inline-block;
            position: relative;
            padding-bottom: 10px;
        }

        h2.section-title::after {
            content: "";
            display: block;
            width: 30px;
            height: 2px;
            background: var(--sub-color);
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        /* プロフィールエリア冒頭 */
        .intro-name-area {
            padding: 60px 20px 20px;
        }

        /* お名前ドーン！ */
        .huge-name {
            font-size: 5rem; /* PCでの特大サイズ */
            font-weight: bold;
            color: var(--sub-color);
            letter-spacing: 0.1em;
            margin-bottom: 10px;
            line-height: 1;
        }

        /* ABOUT内アイコン (メインビジュアルだった画像を使用) */
        .profile-icon {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--sub-color);
            margin: 20px 0;
        }

        .sayla-id {
            color: var(--sub-color);
            font-size: 1.1rem;
            margin-bottom: 25px;
            display: block;
            font-weight: bold;
        }

        .profile-text {
            font-size: 0.95rem;
            margin-bottom: 30px;
            text-align: center;
        }

        /* SNSリンク */
        .sns-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .sns-link {
            width: 45px;
            height: 45px;
            background: #fff;
            border: 1px solid var(--sub-color);
            color: var(--sub-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            border-radius: 50%;
        }

        .sns-link:hover {
            background: var(--sub-color);
            color: #fff;
            transform: translateY(-3px);
        }

        /* WORKS (CREATIVE) */
        .works-grid {
            display: flex;
            flex-direction: column;
            gap: 30px;
            align-items: center;
        }

        .work-item {
            width: 100%;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .work-info {
            padding: 15px;
        }

        .work-info h3 {
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        .tags {
            display: flex;
            gap: 5px;
            justify-content: center;
        }

        .tag {
            font-size: 0.7rem;
            background-color: var(--accent-color);
            color: #fff;
            padding: 1px 10px;
            border-radius: 10px;
            font-weight: bold;
        }

        /* フッター */
        footer {
            padding: 60px 0;
            background-color: #fcfcfc;
            color: #999;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
        }

        /* --- スマホ調整 (1024px以下) --- */
        @media (max-width: 1024px) {
            .container {
                display: block;
            }

            .left-side {
                width: 100%;
                height: 50vh;
                position: relative;
                border-right: none;
            }

            .right-side {
                width: 100%;
                margin-left: 0;
                padding-top: 0;
            }

            .huge-name {
                font-size: 3.5rem; /* スマホでは少し抑えめに */
            }

            section {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 左側：固定画像 (アイコンだったもの) -->
        <div class="left-side"></div>

        <!-- 右側：コンテンツ -->
        <div class="right-side">
            
            <div class="intro-name-area">
                <h1 class="huge-name">Sayla</h1>
                <span class="sayla-id">@sayla_ch</span>

                <!-- SNSリンクを名前のすぐ下に配置してlit.link風に -->
                <div class="sns-container">
                    <a href="https://x.com/sayla_ch" target="_blank" class="sns-link" title="X (Twitter)"><i class="fa-brands fa-x-twitter"></i></a>
                    <a href="https://twitcasting.tv/_say_la" target="_blank" class="sns-link" title="TwitCasting"><i class="fa-solid fa-tower-broadcast"></i></a>
                    <a href="http://www.youtube.com/@sayla_ch" target="_blank" class="sns-link" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
                    <a href="https://nana-music.com/users/10371954" target="_blank" class="sns-link" title="nana"><i class="fa-solid fa-microphone-lines"></i></a>
                    <a href="https://marshmallow-qa.com/_say_la" target="_blank" class="sns-link" title="Marshmallow"><i class="fa-solid fa-envelope-open-text"></i></a>
                </div>
            </div>

            <section id="about">
                <div class="about-content">
                    <!-- 丸アイコン (メインビジュアルだったもの) -->
                    <img src="image/20251210_215907.jpg" alt="Sayla Icon" class="profile-icon">
                    
                    <div class="profile-text">
                        <p>INFP-T ／ 成人済 ／ 低音女子・両声類かも？</p>
                        <p>一人称迷子で言動荒めな奴と覚えてください</p>
                        <p>歌とゲームが好き</p>
                        <p>夢はでっかく配信者屋さんになること</p>
                        <p style="margin-top: 0.8em; font-weight: bold; color: var(--accent-color);">推しは推せる時に推そうな？</p>
                    </div>
                </div>
            </section>

            <section id="works">
                <h2 class="section-title">CREATIVE</h2>
                <div class="works-grid">
                    
                    <div class="work-item">
                        <div class="video-wrapper">
                            <iframe src="https://www.youtube.com/embed/xlNm8FPTJRo" title="YouTube video player" allowfullscreen></iframe>
                        </div>
                        <div class="work-info">
                            <h3>アイデンティティ / 恋町レノ × Sayla</h3>
                            <div class="tags">
                                <span class="tag">Vocal</span>
                                <span class="tag">MIX</span>
                                <span class="tag">Movie</span>
                            </div>
                        </div>
                    </div>

                    <div class="work-item">
                        <div class="video-wrapper">
                            <iframe src="https://www.youtube.com/embed/CeFgU-8giUU" title="YouTube video player" allowfullscreen></iframe>
                        </div>
                        <div class="work-info">
                            <h3>プロポーズ💍歌ってみた【恋町レノ】</h3>
                            <div class="tags">
                                <span class="tag">MIX</span>
                            </div>
                        </div>
                    </div>

                </div>
            </section>

            <footer>
                &copy; Sayla. All Rights Reserved.
            </footer>
        </div> <!-- /right-side -->
    </div> <!-- /container -->

</body>
</html>
