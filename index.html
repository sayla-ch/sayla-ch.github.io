<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清良（せいら）公式サイト</title>
    
    <!-- ファビコン設定 -->
    <link rel="icon" href="image/20251229_215250.jpg">
    <link rel="apple-touch-icon" href="image/20251229_215250.jpg">

    <!-- アイコン: FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        /* フォント設定: 赤薔薇シンデレラ */
        @font-face {
            font-family: 'Akabara';
            src: url('font/MODI_akabara-cinderella_2018_0811/akabara-cinderella.ttf') format('truetype');
        }

        :root {
            --bg-color: #FFFFFF;
            --sub-color: #40A2C7;       /* 青 */
            --accent-color: #CD498F;    /* ピンク */
            --main-text: #333333;
            --border-color: #EEEEEE;
            --footer-bg: #fcfcfc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--main-text);
            font-family: 'Akabara', "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            text-align: center;
        }

        a {
            text-decoration: none !important;
            color: inherit;
            transition: 0.3s;
        }

        /* --- レイアウト設定 (PC) --- */
        .container {
            display: flex;
            width: 100%;
        }

        /* 左半分：スライドショー */
        .left-side {
            width: 50%;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            overflow: hidden;
            border-right: 1px solid var(--border-color);
            background-color: #f0f0f0;
        }

        .slideshow {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .slide {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-size: cover;
            background-position: center;
            opacity: 0;
            animation: sliderAnim 25s infinite; /* 5枚×5秒=25秒 */
        }

        /* 画像5枚の設定 */
        .slide:nth-child(1) { background-image: url("image/20251025_185455.jpg"); animation-delay: 0s; }
        .slide:nth-child(2) { background-image: url("image/20251025_185504.jpg"); animation-delay: 5s; }
        .slide:nth-child(3) { background-image: url("image/20251116_153310.jpg"); animation-delay: 10s; }
        .slide:nth-child(4) { background-image: url("image/20251116_153316.jpg"); animation-delay: 15s; }
        .slide:nth-child(5) { background-image: url("image/20251116_153322.jpg"); animation-delay: 20s; }

        @keyframes sliderAnim {
            0% { opacity: 0; }
            4% { opacity: 1; }
            20% { opacity: 1; }
            24% { opacity: 0; }
            100% { opacity: 0; }
        }

        .right-side {
            width: 50%;
            margin-left: 50%;
            display: flex;
            flex-direction: column;
        }

        /* プロフィールエリア：余白を詰めて上に持ち上げ */
        .profile-section {
            padding: 40px 20px 60px; /* 上の余白を120pxから40pxへ短縮 */
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .huge-name {
            font-size: 5rem;
            font-weight: bold;
            color: var(--sub-color);
            letter-spacing: 0.05em;
            line-height: 1;
            margin-bottom: 10px;
        }

        .sayla-id {
            color: var(--sub-color);
            font-size: 1.1rem;
            display: block;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .profile-icon {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid var(--sub-color);
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* SNSリンク */
        .sns-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
        }

        .sns-link {
            width: 50px;
            height: 50px;
            background: #fff;
            border: 1px solid var(--sub-color);
            color: var(--sub-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            border-radius: 50%;
        }

        .sns-link:hover {
            background: var(--sub-color);
            color: #fff;
            transform: translateY(-3px);
        }

        /* コメント欄テキスト（改行重視） */
        .profile-text {
            font-size: 1rem;
            text-align: center;
            padding: 0 10%;
        }
        .profile-text p {
            margin-bottom: 0.5em;
        }

        /* LOGセクション */
        .log-section {
            background-color: var(--sub-color);
            padding: 60px 20px 80px;
            color: #FFFFFF;
        }

        .log-title {
            font-size: 2.2rem;
            letter-spacing: 0.4em;
            margin-bottom: 50px;
            font-weight: bold;
        }

        .works-grid {
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
            max-width: 500px;
            margin: 0 auto;
        }

        .work-item {
            width: 100%;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            color: var(--main-text);
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .work-info { padding: 20px; }
        .work-info h3 { font-size: 1rem; margin-bottom: 12px; }
        .tags { display: flex; gap: 5px; justify-content: center; }
        .tag { font-size: 0.7rem; background-color: var(--accent-color); color: #fff; padding: 2px 12px; border-radius: 10px; font-weight: bold; }

        footer {
            padding: 50px 0;
            background-color: var(--footer-bg);
            color: #999;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            border-top: 1px solid var(--border-color);
        }

        /* --- スマホ調整 (1024px以下) --- */
        @media (max-width: 1024px) {
            .container { display: block; }
            .left-side {
                width: 100%;
                height: 100vw; /* 高さを幅と同じにして正方形にする */
                position: relative;
                border-right: none;
            }
            .right-side {
                width: 100%;
                margin-left: 0;
            }
            .profile-section { min-height: auto; padding: 40px 20px 60px; }
            .huge-name { font-size: 3.5rem; }
            .profile-icon { width: 140px; height: 140px; }
            .profile-text { padding: 0 5%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 左側：スライドショー (5枚) -->
        <div class="left-side">
            <div class="slideshow">
                <div class="slide"></div>
                <div class="slide"></div>
                <div class="slide"></div>
                <div class="slide"></div>
                <div class="slide"></div>
            </div>
        </div>

        <!-- 右側：コンテンツ -->
        <div class="right-side">
            
            <div class="profile-section">
                <h1 class="huge-name">Sayla</h1>
                <span class="sayla-id">@sayla_ch</span>

                <!-- アイコン画像差し替え -->
                <img src="image/20251229_215250.jpg" alt="Sayla Icon" class="profile-icon">

                <!-- SNSリンク (X, nana, TwitCasting, YouTube, Marshmallow) -->
                <div class="sns-container">
                    <a href="https://x.com/sayla_ch" target="_blank" class="sns-link" title="X (Twitter)"><i class="fa-brands fa-x-twitter"></i></a>
                    <a href="https://nana-music.com/users/10371954" target="_blank" class="sns-link" title="nana"><i class="fa-solid fa-microphone-lines"></i></a>
                    <a href="https://twitcasting.tv/_say_la" target="_blank" class="sns-link" title="TwitCasting"><i class="fa-solid fa-tower-broadcast"></i></a>
                    <a href="http://www.youtube.com/@sayla_ch" target="_blank" class="sns-link" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
                    <a href="https://marshmallow-qa.com/_say_la" target="_blank" class="sns-link" title="Marshmallow"><i class="fa-solid fa-envelope-open-text"></i></a>
                </div>

                <div class="profile-text">
                    <p>INFP-T ／ 成人済</p>
                    <p>低音女子・両声類かも？</p>
                    <p>一人称迷子で言動荒めな奴と覚えてください</p>
                    <p>歌とゲームが好き</p>
                    <p>夢はでっかく配信者屋さんになること</p>
                    <p style="margin-top: 1.2em; font-weight: bold; color: var(--accent-color);">推しは推せる時に推そうな？</p>
                </div>
            </div>

            <div class="log-section" id="works">
                <h2 class="log-title">LOG</h2>
                <div class="works-grid">
                    <div class="work-item">
                        <div class="video-wrapper">
                            <iframe src="https://www.youtube.com/embed/xlNm8FPTJRo" title="YouTube video player" allowfullscreen></iframe>
                        </div>
                        <div class="work-info">
                            <h3>アイデンティティ / 恋町レノ × Sayla</h3>
                            <div class="tags">
                                <span class="tag">Vocal</span>
                                <span class="tag">MIX</span>
                                <span class="tag">Movie</span>
                            </div>
                        </div>
                    </div>
                    <div class="work-item">
                        <div class="video-wrapper">
                            <iframe src="https://www.youtube.com/embed/CeFgU-8giUU" title="YouTube video player" allowfullscreen></iframe>
                        </div>
                        <div class="work-info">
                            <h3>プロポーズ💍歌ってみた【恋町レノ】</h3>
                            <div class="tags"><span class="tag">MIX</span></div>
                        </div>
                    </div>
                </div>
            </div>

            <footer>
                &copy; Sayla. All Rights Reserved.
            </footer>
        </div>
    </div>

</body>
</html>
