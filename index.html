<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAYLA / 清良 OFFICIAL SITE</title>
    <!-- アイコン用FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        /* 全体設定 */
        :root {
            --bg-color: #0a0a0a;
            --text-color: #ffffff;
            --accent-color: #e60012; /* 差し色（お好みで変えてください） */
            --gray: #888888;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "futura-pt", "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: 0.3s;
        }

        /* ヘッダー */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }

        header h1 {
            font-size: 1.5rem;
            letter-spacing: 0.3em;
            font-weight: 700;
        }

        /* メインビジュアル（パララックス） */
        .keyvisual {
            height: 100vh;
            width: 100%;
            background-image: url("image/20251210_215907.jpg");
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* セクション共通 */
        section {
            padding: 100px 5%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 50px;
            letter-spacing: 0.2em;
            border-bottom: 1px solid var(--gray);
            display: inline-block;
            width: 100%;
            padding-bottom: 10px;
        }
