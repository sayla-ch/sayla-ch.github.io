<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清良（せいら）公式サイト</title>
    
    <!-- ファビコン設定 -->
    <link rel="icon" href="image/20251229_215250.jpg">
    <link rel="apple-touch-icon" href="image/20251229_215250.jpg">

    <!-- アイコン: FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        /* フォント設定: 黒薔薇シンデレラ */
        @font-face {
            font-family: 'Kurobara';
            src: url('font/MODI_kurobara-cinderella_2018_0805/kurobara-cinderella.ttf') format('truetype');
        }

        :root {
            --bg-color: #FFFFFF;
            --sub-color: #40A2C7;       /* 青 */
            --accent-color: #CD498F;    /* ピンク */
            --main-text: #333333;
            --border-color: #EEEEEE;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--main-text);
            font-family: 'Kurobara', "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            text-align: center;
        }

        a {
            text-decoration: none !important;
            color: inherit;
            transition: 0.3s;
        }

        /* --- レイアウト設定 (PC) --- */
        .container {
            display: flex;
            width: 100%;
        }

        .left-side {
            width: 50%;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            background-image: url("image/20251210_215907.jpg"); /* 青系のメイン画像 */
            background-size: cover;
            background-position: center;
            border-right: 1px solid var(--border-color);
        }

        .right-side {
            width: 50%;
            margin-left: 50%;
            padding-top: 40px;
        }

        /* お名前エリア */
        .intro-name-area {
            padding: 40px 20px 0;
        }

        .huge-name {
            font-size: 4.5rem;
            font-weight: bold;
            color: var(--sub-color);
            letter-spacing: 0.05em;
            line-height: 1;
        }

        .sayla-id {
            color: var(--sub-color);
            font-size: 1.1rem;
            display: block;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* ABOUT アイコン */
        .profile-icon {
            width: 150px; /* サイズアップ */
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--accent-color); /* ピンクの枠線 */
            margin: 10px 0 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* SNSリンク */
        .sns-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 50px; /* 下のテキストとの間隔を空ける */
        }

        .sns-link {
            width: 45px;
            height: 45px;
            background: #fff;
            border: 1px solid var(--sub-color);
            color: var(--sub-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            border-radius: 50%;
        }

        .sns-link:hover {
            background: var(--sub-color);
            color: #fff;
            transform: translateY(-3px);
        }

        /* コメント欄テキスト */
        .profile-text {
            font-size: 0.95rem;
            margin-bottom: 60px;
            text-align: center;
            padding: 0 10%;
        }

        /* LOG見出し（青い四角のデザイン） */
        .section-title-box {
            display: inline-block;
            background-color: var(--sub-color);
            color: #FFFFFF;
            padding: 8px 40px;
            font-size: 1.4rem;
            letter-spacing: 0.3em;
            margin-bottom: 40px;
            border-radius: 4px; /* 少し角丸 */
        }

        /* WORKS (LOG) */
        section#works {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 20px 60px;
        }

        .works-grid {
            display: flex;
            flex-direction: column;
            gap: 35px;
            align-items: center;
        }

        .work-item {
            width: 100%;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .work-info {
            padding: 15px;
        }

        .work-info h3 {
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .tags {
            display: flex;
            gap: 5px;
            justify-content: center;
        }

        .tag {
            font-size: 0.7rem;
            background-color: var(--accent-color);
            color: #fff;
            padding: 1px 12px;
            border-radius: 10px;
            font-weight: bold;
        }

        /* フッター */
        footer {
            padding: 40px 0;
            background-color: #fcfcfc;
            color: #999;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            border-top: 1px solid var(--border-color);
        }

        /* --- スマホ調整 (1024px以下) --- */
        @media (max-width: 1024px) {
            .container { display: block; }
            .left-side {
                width: 100%;
                height: 50vh;
                position: relative;
                border-right: none;
            }
            .right-side {
                width: 100%;
                margin-left: 0;
                padding-top: 0;
            }
            .huge-name { font-size: 3.5rem; }
            .profile-text { padding: 0 5%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 左側：固定背景画像 -->
        <div class="left-side"></div>

        <!-- 右側：コンテンツ -->
        <div class="right-side">
            
            <div class="intro-name-area">
                <h1 class="huge-name">Sayla</h1>
                <span class="sayla-id">@sayla_ch</span>

                <!-- 正方形のアイコン画像（枠線ピンク） -->
                <img src="image/20251025_185455.jpg" alt="Sayla Icon" class="profile-icon">

                <!-- SNSリンク -->
                <div class="sns-container">
                    <a href="https://x.com/sayla_ch" target="_blank" class="sns-link" title="X (Twitter)"><i class="fa-brands fa-x-twitter"></i></a>
                    <a href="https://twitcasting.tv/_say_la" target="_blank" class="sns-link" title="TwitCasting"><i class="fa-solid fa-tower-broadcast"></i></a>
                    <a href="http://www.youtube.com/@sayla_ch" target="_blank" class="sns-link" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
                    <a href="https://nana-music.com/users/10371954" target="_blank" class="sns-link" title="nana"><i class="fa-solid fa-microphone-lines"></i></a>
                    <a href="https://marshmallow-qa.com/_say_la" target="_blank" class="sns-link" title="Marshmallow"><i class="fa-solid fa-envelope-open-text"></i></a>
                </div>

                <!-- コメント欄 -->
                <div class="profile-text">
                    <p>INFP-T ／ 成人済 ／ 低音女子・両声類かも？</p>
                    <p>一人称迷子で言動荒めな奴と覚えてください</p>
                    <p>歌とゲームが好き</p>
                    <p>夢はでっかく配信者屋さんになること</p>
                    <p style="margin-top: 0.8em; font-weight: bold; color: var(--accent-color);">推しは推せる時に推そうな？</p>
                </div>
            </div>

            <section id="works">
                <!-- LOG見出し（青ボックスデザイン） -->
                <div class="section-title-box">LOG</div>

                <div class="works-grid">
                    
                    <div class="work-item">
                        <div class="video-wrapper">
                            <iframe src="https://www.youtube.com/embed/xlNm8FPTJRo" title="YouTube video player" allowfullscreen></iframe>
                        </div>
                        <div class="work-info">
                            <h3>アイデンティティ / 恋町レノ × Sayla</h3>
                            <div class="tags">
                                <span class="tag">Vocal</span>
                                <span class="tag">MIX</span>
                                <span class="tag">Movie</span>
                            </div>
                        </div>
                    </div>

                    <div class="work-item">
                        <div class="video-wrapper">
                            <iframe src="https://www.youtube.com/embed/CeFgU-8giUU" title="YouTube video player" allowfullscreen></iframe>
                        </div>
                        <div class="work-info">
                            <h3>プロポーズ💍歌ってみた【恋町レノ】</h3>
                            <div class="tags">
                                <span class="tag">MIX</span>
                            </div>
                        </div>
                    </div>

                </div>
            </section>

            <footer>
                &copy; Sayla. All Rights Reserved.
            </footer>
        </div> <!-- /right-side -->
    </div> <!-- /container -->

</body>
</html>
