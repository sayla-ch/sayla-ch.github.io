<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayla OFFICIAL SITE</title>
    <!-- アイコン: FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        /* 基本設定 */
        :root {
            --bg-color: #000000;
            --card-bg: #111111;
            --text-color: #ffffff;
            --accent-color: #ff0033; /* 赤系のアクセント */
            --gray-text: #aaaaaa;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.8;
            overflow-x: hidden;
        }

        /* ヘッダー */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid #222;
        }

        header h1 {
            font-size: 1.4rem;
            letter-spacing: 0.4em;
            font-weight: bold;
            margin: 0;
        }

        /* メインビジュアル */
        .keyvisual {
            position: relative;
            width: 100%;
            height: 80vh; /* 画面の80%の高さ */
            background-color: #111; /* 画像がない時の予備色 */
            background-image: url("image/20251210_215907.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed; /* パララックス */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .keyvisual::after {
            content: "";
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 150px;
            background: linear-gradient(to top, var(--bg-color), transparent);
        }

        /* 各セクション */
        section {
            max-width: 900px;
            margin: 0 auto;
            padding: 80px 20px;
        }

        h2.section-title {
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: 0.2em;
            position: relative;
        }

        h2.section-title::after {
            content: "";
            display: block;
            width: 30px;
            height: 2px;
            background: var(--accent-color);
            margin: 10px auto 0;
        }

        /* プロフィール & SNS */
        .about-content {
            text-align: center;
            margin-bottom: 40px;
        }

        .sayla-name {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .sayla-id {
            color: var(--gray-text);
            margin-bottom: 20px;
        }

        .sns-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .sns-link {
            background: var(--card-bg);
            border: 1px solid #333;
            padding: 15px;
            text-align: center;
            text-decoration: none;
            color: white;
            font-weight: bold;
            transition: 0.3s;
            border-radius: 4px;
        }

        .sns-link:hover {
            background: #222;
            border-color: var(--accent-color);
        }

        /* 動画実績（WORKS） */
        .works-grid {
            display: flex;
            flex-direction: column;
            gap: 50px;
        }

        .work-item {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #222;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
        }

        .video-wrapper.shorts {
            padding-bottom: 177.77%; /* 9:16 (Shorts用) */
            max-width: 350px;
            margin: 0 auto;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .work-info {
            padding: 20px;
        }

        .work-info h3 {
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 0.8rem;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 2px 8px;
            border-radius: 2px;
        }

        /* フッター */
        footer {
            padding: 60px 0;
            text-align: center;
            border-top: 1px solid #222;
            color: #555;
            font-size: 0.8rem;
        }

        /* スマホ対応 */
        @media (max-width: 600px) {
            .keyvisual {
                background-attachment: scroll; /* スマホではパララックス解除 */
                height: 60vh;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Sayla</h1>
    </header>

    <div class="keyvisual"></div>

    <section id="about">
        <h2 class="section-title">ABOUT</h2>
        <div class="about-content">
            <div class="sayla-name">Sayla</div>
            <p class="sayla-id">@sayla_ch</p>
            <p>ツイキャス・nanaを中心に活動中。<br>歌ってみたのMIX制作、動画制作なども行っています。</p>
        </div>

        <div class="sns-container">
            <a href="https://x.com/sayla_ch" target="_blank" class="sns-link">
                <i class="fa-brands fa-x-twitter"></i> X (Twitter)
            </a>
            <a href="https://twitcasting.tv/_say_la" target="_blank" class="sns-link">
                <i class="fa-solid fa-tower-broadcast"></i> TwitCasting
            </a>
            <a href="http://www.youtube.com/@sayla_ch" target="_blank" class="sns-link">
                <i class="fa-brands fa-youtube"></i> YouTube
            </a>
        </div>
    </section>

    <section id="works">
        <h2 class="section-title">WORKS / MIX</h2>
        <div class="works-grid">
            
            <!-- アイデンティティ -->
            <div class="work-item">
                <div class="video-wrapper">
                    <iframe src="https://www.youtube.com/embed/xlNm8FPTJRo" allowfullscreen></iframe>
                </div>
                <div class="work-info">
                    <h3>アイデンティティ / 恋町レノ × Sayla</h3>
                    <div class="tags">
                        <span class="tag">Vocal</span>
                        <span class="tag">Mix</span>
                        <span class="tag">Movie</span>
                    </div>
                </div>
            </div>

            <!-- プロポーズ -->
            <div class="work-item">
                <div class="video-wrapper shorts">
                    <iframe src="https://www.youtube.com/embed/CeFgU-8giUU" allowfullscreen></iframe>
                </div>
                <div class="work-info" style="text-align: center;">
                    <h3>プロポーズ💍歌ってみた【恋町レノ】</h3>
                    <div class="tags" style="justify-content: center;">
                        <span class="tag">Mix協力</span>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <footer>
        &copy; Sayla. All Rights Reserved.
    </footer>

</body>
</html>
