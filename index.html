<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayla OFFICIAL SITE</title>
    
    <!-- ファビコン設定 -->
    <link rel="icon" href="image/20251229_215250.jpg">
    <link rel="apple-touch-icon" href="image/20251229_215250.jpg">

    <!-- アイコン: FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        /* フォント設定: 黒薔薇シンデレラ */
        @font-face {
            font-family: 'Kurobara';
            src: url('font/MODI_kurobara-cinderella_2018_0805/kurobara-cinderella.ttf') format('truetype');
        }

        :root {
            --bg-color: #FFFFFF;
            --sub-color: #40A2C7;
            --accent-color: #CD498F;
            --main-text: #333333;
            --border-color: #EEEEEE;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--main-text);
            font-family: 'Kurobara', "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            text-align: center;
        }

        /* リンクの下線を一括解除 */
        a {
            text-decoration: none !important;
            color: inherit;
            transition: 0.3s;
        }

        /* ヘッダー */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            z-index: 1000;
            border-bottom: 1px solid var(--sub-color);
        }

        header h1 {
            font-size: 1.6rem;
            letter-spacing: 0.2em;
            color: var(--sub-color);
            font-weight: bold;
        }

        /* メインビジュアル */
        .keyvisual {
            position: relative;
            width: 100%;
            height: 60vh;
            background-image: url("image/20251210_215907.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin-bottom: 20px;
        }

        /* セクション共通 */
        section {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h2.section-title {
            font-size: 1.4rem;
            margin-bottom: 25px;
            letter-spacing: 0.2em;
            display: inline-block;
            position: relative;
            padding-bottom: 10px;
        }

        h2.section-title::after {
            content: "";
            display: block;
            width: 30px;
            height: 2px;
            background: var(--sub-color);
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        /* ABOUT */
        .profile-icon {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--sub-color);
            margin-bottom: 15px;
        }

        .sayla-name {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 0;
        }

        .sayla-id {
            color: var(--sub-color);
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: block;
            font-weight: bold;
        }

        .profile-text {
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        /* SNSリンク */
        .sns-container {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .sns-link {
            width: 45px;
            height: 45px;
            background: #fff;
            border: 1px solid var(--sub-color);
            color: var(--sub-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            border-radius: 50%;
        }

        .sns-link:hover {
            background: var(--sub-color);
            color: #fff;
            transform: translateY(-3px);
        }

        /* WORKS (YouTube) */
        .works-grid {
            display: grid;
            /* PCでは2カラム */
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 10px;
        }

        .work-item {
            width: 100%;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .work-info {
            padding: 15px;
        }

        .work-info h3 {
            font-size: 0.9rem;
            margin-bottom: 10px;
            /* タイトルの高さを揃える */
            height: 2.4em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tags {
            display: flex;
            gap: 5px;
            justify-content: center;
        }

        .tag {
            font-size: 0.7rem;
            background-color: var(--accent-color);
            color: #fff;
            padding: 1px 10px;
            border-radius: 10px;
            font-weight: bold;
        }

        /* フッター */
        footer {
            padding: 40px 0;
            background-color: #fcfcfc;
            color: #999;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
        }

        /* スマホ調整 */
        @media (max-width: 768px) {
            .works-grid {
                /* スマホでは1カラム */
                grid-template-columns: 1fr;
            }
            .keyvisual { height: 40vh; background-attachment: scroll; }
            section { padding: 30px 15px; }
            header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Sayla</h1>
    </header>

    <div class="keyvisual"></div>

    <section id="about">
        <h2 class="section-title">ABOUT</h2>
        <div class="about-content">
            <img src="image/20251025_185455.jpg" alt="Sayla Icon" class="profile-icon">
            <div class="sayla-name">Sayla</div>
            <span class="sayla-id">@sayla_ch</span>
            
            <div class="profile-text">
                <p>INFP-T ／ 成人済 ／ 低音女子・両声類かも？</p>
                <p>一人称迷子で言動荒めな奴と覚えてください</p>
                <p>歌とゲームが好き</p>
                <p>夢はでっかく配信者屋さんになること</p>
                <p style="margin-top: 0.8em; font-weight: bold; color: var(--accent-color);">推しは推せる時に推そうな？</p>
            </div>
        </div>

        <div class="sns-container">
            <a href="https://x.com/sayla_ch" target="_blank" class="sns-link" title="X (Twitter)"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="https://twitcasting.tv/_say_la" target="_blank" class="sns-link" title="TwitCasting"><i class="fa-solid fa-tower-broadcast"></i></a>
            <a href="http://www.youtube.com/@sayla_ch" target="_blank" class="sns-link" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
            <a href="https://nana-music.com/users/10371954" target="_blank" class="sns-link" title="nana"><i class="fa-solid fa-microphone-lines"></i></a>
            <a href="https://marshmallow-qa.com/_say_la" target="_blank" class="sns-link" title="Marshmallow"><i class="fa-solid fa-envelope-open-text"></i></a>
        </div>
    </section>

    <section id="works">
        <h2 class="section-title">WORKS</h2>
        <div class="works-grid">
            
            <!-- 実績1 -->
            <div class="work-item">
                <div class="video-wrapper">
                    <iframe src="https://www.youtube.com/embed/xlNm8FPTJRo" title="YouTube video player" allowfullscreen></iframe>
                </div>
                <div class="work-info">
                    <h3>アイデンティティ / 恋町レノ × Sayla</h3>
                    <div class="tags">
                        <span class="tag">Vocal</span>
                        <span class="tag">MIX</span>
                        <span class="tag">Movie</span>
                    </div>
                </div>
            </div>

            <!-- 実績2 -->
            <div class="work-item">
                <div class="video-wrapper">
                    <iframe src="https://www.youtube.com/embed/CeFgU-8giUU" title="YouTube video player" allowfullscreen></iframe>
                </div>
                <div class="work-info">
                    <h3>プロポーズ💍歌ってみた【恋町レノ】</h3>
                    <div class="tags">
                        <span class="tag">MIX</span>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <footer>
        &copy; Sayla. All Rights Reserved.
    </footer>

</body>
</html>
